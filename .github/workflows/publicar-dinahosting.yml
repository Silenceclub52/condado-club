# Publica la web en Dinahosting (condadoclub.es) por FTPS.
#
# - Al subir cambios a main: copia de seguridad del servidor + publicación.
# - Manual (pestaña Actions → "Publicar en Dinahosting" → Run workflow):
#     "comparar" → solo copia de seguridad y lista de diferencias, no sube nada.
#     "publicar" → copia de seguridad + publicación.
#
# Solo sube los archivos que son distintos (o faltan) en el servidor, de uno en
# uno y sobrescribiendo en su sitio: nunca borra un archivo antes de subirlo.
# Nunca borra archivos del servidor; cgi-bin y .well-known no se tocan.
#
# Necesita el secreto FTP_PASSWORD (Settings → Secrets and variables → Actions).

name: Publicar en Dinahosting

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:
    inputs:
      modo:
        description: "comparar = solo revisar (no sube nada) · publicar = subir a condadoclub.es"
        type: choice
        options: [comparar, publicar]
        default: comparar

concurrency:
  group: dinahosting
  cancel-in-progress: false

env:
  FTP_HOST: condadoclub-es.espacioseguro.com
  FTP_USER: condadoclub_ftp
  LFTP_OPTS: "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 10; set net:reconnect-interval-base 5; set net:timeout 60;"

jobs:
  dinahosting:
    name: ${{ (github.event_name == 'push' || inputs.modo == 'publicar') && 'Publicar' || 'Comparar' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Copia de seguridad del servidor
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASSWORD" || { echo "::error::Falta el secreto FTP_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/copia-servidor"
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "$LFTP_OPTS
            mirror --verbose --parallel=2 --exclude-glob cgi-bin/ --exclude-glob .well-known/ / $RUNNER_TEMP/copia-servidor;
            bye"

      - name: Guardar la copia (descargable 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: copia-servidor-${{ github.run_number }}
          path: ${{ runner.temp }}/copia-servidor
          include-hidden-files: true
          retention-days: 90

      - name: Archivos a subir (distintos o que faltan en el servidor)
        run: |
          mkdir -p "$RUNNER_TEMP/subir"
          git -c core.quotePath=false ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in .github/*) continue ;; esac
            if ! cmp -s "$f" "$RUNNER_TEMP/copia-servidor/$f"; then
              mkdir -p "$RUNNER_TEMP/subir/$(dirname "$f")"
              cp -p "$f" "$RUNNER_TEMP/subir/$f"
            fi
          done
          {
            echo "### Archivos que se subirán"
            echo '```'
            (cd "$RUNNER_TEMP/subir" && find . -type f | sort) || true
            echo '```'
            echo "### Detalle de cambios"
            echo '```diff'
            for f in index.html evento/index.html robots.txt sitemap.xml; do
              diff -u "$RUNNER_TEMP/copia-servidor/$f" "$f" 2>&1 | head -200 || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir a condadoclub.es
        if: github.event_name == 'push' || inputs.modo == 'publicar'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$(find "$RUNNER_TEMP/subir" -type f)" ]; then
            echo "### Nada que subir: el servidor ya está al día" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "$LFTP_OPTS
            mirror --reverse --verbose --overwrite --parallel=1 $RUNNER_TEMP/subir /;
            bye"
          echo "### Publicado en https://condadoclub.es" >> "$GITHUB_STEP_SUMMARY"
