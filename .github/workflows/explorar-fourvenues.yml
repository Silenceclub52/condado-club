# Solo lectura: investiga de dónde carga el widget de Fourvenues los eventos.
# Vive solo en la rama prueba-eventos; no publica nada.
name: Explorar Fourvenues
on:
  push:
    branches: [prueba-eventos]
    paths: [".github/workflows/explorar-fourvenues.yml"]
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Script del widget completo (desde la letra 3000)
        run: |
          mkdir -p out
          curl -sSL -A "Mozilla/5.0" -o out/widget.js "https://www.fourvenues.com/assets/iframe/condado-club-denia/events"
          tail -c +3000 out/widget.js
      - name: Página del iframe con la lista de eventos
        run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          code=$(curl -sSL -A "$UA" -o out/iframe.html -w "%{http_code} %{content_type} %{url_effective}" "https://www.fourvenues.com/iframe/condado-club-denia/events")
          echo "== $code ($(wc -c < out/iframe.html) bytes)"
          head -c 4000 out/iframe.html; echo
          echo "== enlaces a eventos"; grep -oE "condado-club-denia/events/[A-Za-z0-9_-]+" out/iframe.html | sort -u | head -40
          echo "== json-ld / datos"; grep -oE "application/ld\+json|__NEXT_DATA__|ng-state|window\.__[A-Z_]+" out/iframe.html | sort | uniq -c
          echo "== scripts"; grep -oE "src=\"[^\"]+\"" out/iframe.html | head -30
          echo "== api"; grep -oE "https?://[^\"' )<>]*api[^\"' )<>]*" out/iframe.html | sort -u | head -30
      - name: Página pública de eventos de Condado en fourvenues.com
        run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for u in "https://www.fourvenues.com/es/condado-club-denia/events" "https://www.fourvenues.com/condado-club-denia/events"; do
            f="out/pub-$(echo "$u" | md5sum | cut -c1-6).html"
            code=$(curl -sSL -A "$UA" -o "$f" -w "%{http_code} %{url_effective}" "$u" || true)
            echo "== $u -> $code ($(wc -c < "$f" 2>/dev/null) bytes)"
            grep -oE "events/[A-Za-z0-9_-]{8,}" "$f" | sort -u | head -20
            grep -c "application/ld+json" "$f" || true
            grep -oE '"@type":"[A-Za-z]+"' "$f" | sort | uniq -c | head
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fourvenues-exploracion-2
          path: out
