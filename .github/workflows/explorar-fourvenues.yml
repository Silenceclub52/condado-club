# Solo lectura: investiga de dónde carga el widget de Fourvenues los eventos.
# Vive solo en la rama prueba-eventos; no publica nada.
name: Explorar Fourvenues
on:
  push:
    branches: [prueba-eventos]
    paths: [".github/workflows/explorar-fourvenues.yml"]
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Parte central del script del widget
        run: |
          mkdir -p out
          curl -sSL -A "Mozilla/5.0" -o out/widget.js "https://www.fourvenues.com/assets/iframe/condado-club-denia/events"
          head -c 9000 out/widget.js | tail -c 6200
      - name: Navegador real en condadoclub.es/evento/ registrando peticiones a Fourvenues
        run: |
          mkdir -p nav && cd nav && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > nav.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
            const seen = [];
            p.on('response', async (r) => {
              const u = r.url();
              if (!/fourvenues/.test(u)) return;
              const ct = r.headers()['content-type'] || '';
              let body = '';
              if (/json/.test(ct)) { try { body = (await r.text()).slice(0, 2500); } catch (e) {} }
              seen.push({ u, s: r.status(), ct, m: r.request().method(), h: r.request().headers(), body });
            });
            await p.goto('https://www.condadoclub.es/evento/', { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
            await p.waitForTimeout(8000);
            console.log('URL final:', p.url());
            const frames = p.frames().map(f => f.url());
            console.log('IFRAMES:', JSON.stringify(frames, null, 1));
            for (const x of seen) {
              console.log(`\n=== ${x.m} ${x.s} ${x.u}\n    ct=${x.ct}`);
              if (x.h['app-id'] || x.h['authorization']) console.log('    headers:', JSON.stringify({ 'app-id': x.h['app-id'], authorization: x.h['authorization'] ? '(presente)' : undefined }));
              if (x.body) console.log('    body:', x.body);
            }
            // Enlaces a eventos visibles dentro del iframe
            for (const f of p.frames()) {
              try {
                const links = await f.evaluate(() => [...document.querySelectorAll('a')].map(a => a.href).filter(h => /events\//.test(h)));
                if (links.length) console.log('\nENLACES en', f.url(), '\n', [...new Set(links)].slice(0, 30).join('\n'));
              } catch (e) {}
            }
            await p.screenshot({ path: 'evento.png', fullPage: false });
            await b.close();
          })();
          JS
          node nav.js
      - uses: actions/upload-artifact@v4
        with:
          name: fourvenues-exploracion-3
          path: nav/evento.png
