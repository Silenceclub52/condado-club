# Solo lectura: prueba la clave de la Integrations API de Fourvenues
# y guarda una muestra de eventos (datos públicos) en la rama prueba-eventos.
name: Explorar Fourvenues
on:
  push:
    branches: [prueba-eventos]
    paths: [".github/workflows/explorar-fourvenues.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar-clave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar la clave y leer eventos
        env:
          KEY: ${{ secrets.CONDADO_FOURVENUES_API_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::No encuentro el secreto CONDADO_FOURVENUES_API_KEY"; exit 1; }
          B=https://api.fourvenues.com/integrations
          mkdir -p muestra-fourvenues
          echo "== ¿Quién soy? (channels)"
          code=$(curl -sS -H "X-Api-Key: $KEY" -o muestra-fourvenues/channels.json -w "%{http_code}" "$B/channels/")
          echo "HTTP $code"; head -c 800 muestra-fourvenues/channels.json; echo
          START=$(date -u +%Y-%m-%d); END=$(date -u -d "+90 days" +%Y-%m-%d)
          echo "== Eventos $START → $END"
          code=$(curl -sS -H "X-Api-Key: $KEY" -o muestra-fourvenues/events.json -w "%{http_code}" "$B/events/?start=$START&end=$END")
          echo "HTTP $code"
          jq -r '.data[]? | [(.start|todate), .name, .slug, (.flyer // "-")] | @tsv' muestra-fourvenues/events.json | head -40 || head -c 1500 muestra-fourvenues/events.json
          ID=$(jq -r '.data[0]._id // empty' muestra-fourvenues/events.json)
          if [ -n "$ID" ]; then
            echo "== Detalle del primer evento ($ID)"
            code=$(curl -sS -H "X-Api-Key: $KEY" -o muestra-fourvenues/event-detail.json -w "%{http_code}" "$B/events/$ID")
            echo "HTTP $code"
            jq '.data | {name, slug, code, display_date, start_date, age, outfit, music_genres, artists, image_url, n_ticket_rates: (.ticket_rates|length), ticket_rates: [.ticket_rates[]? | {name, current_price, available}]}' muestra-fourvenues/event-detail.json || head -c 1500 muestra-fourvenues/event-detail.json
          fi
      - name: Guardar muestra en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add muestra-fourvenues
          git commit -m "Muestra de eventos de la API de Fourvenues" || echo "sin cambios"
          git push
