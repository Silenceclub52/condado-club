# Solo lectura: descarga la documentación pública de la API de Fourvenues
# y la guarda en la rama prueba-eventos (carpeta docs-fourvenues/).
name: Explorar Fourvenues
on:
  push:
    branches: [prueba-eventos]
    paths: [".github/workflows/explorar-fourvenues.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar documentación
        run: |
          mkdir -p docs-fourvenues
          B=https://docs.fourvenues.com
          for f in llms.txt llms-full.txt sitemap.xml openapi.json; do
            code=$(curl -sSL -A "Mozilla/5.0" -o "docs-fourvenues/$f" -w "%{http_code}" "$B/$f" || true)
            echo "$f -> $code ($(wc -c < docs-fourvenues/$f) bytes)"
            [ "$code" = "200" ] || rm -f "docs-fourvenues/$f"
          done
          # Páginas en Markdown (Mintlify sirve .md) a partir de llms.txt o del sitemap
          { grep -oE "https://docs\.fourvenues\.com/[^ )\"<]+" docs-fourvenues/llms.txt 2>/dev/null; grep -oE "https://docs\.fourvenues\.com/[^<]+" docs-fourvenues/sitemap.xml 2>/dev/null; } | sed 's/\.md$//' | sort -u > docs-fourvenues/_urls.txt || true
          echo "URLs: $(wc -l < docs-fourvenues/_urls.txt)"
          mkdir -p docs-fourvenues/pages
          while read -r u; do
            case "$u" in *integrations*|*introduction*|*getting*|*recipes*) ;; *) continue ;; esac
            n=$(echo "${u#https://docs.fourvenues.com/}" | tr '/' '_')
            curl -sSL -A "Mozilla/5.0" -o "docs-fourvenues/pages/$n.md" "$u.md" || true
          done < docs-fourvenues/_urls.txt
          ls -la docs-fourvenues docs-fourvenues/pages | head -100
          # OpenAPI de la Integrations API (rutas habituales de Mintlify)
          for p in integrations/openapi.json api-reference/openapi.json openapi.yaml integrations/openapi.yaml; do
            code=$(curl -sSL -A "Mozilla/5.0" -o /tmp/o -w "%{http_code}" "$B/$p" || true)
            echo "$p -> $code"; [ "$code" = "200" ] && cp /tmp/o "docs-fourvenues/$(echo $p | tr '/' '_')"
          done
          du -sh docs-fourvenues
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs-fourvenues
          git commit -m "Documentación de la API de Fourvenues (descarga automática)" || echo "sin cambios"
          git push
