<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos | Condado Club</title>
  <link rel="icon" type="image/png" href="/assets/logos/favicon-condado.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #E8A94A;
      --night: #080509;
      --night-2: #0F0B14;
      --white: #FFFFFF;
      --w60: rgba(255,255,255,0.6);
      --w40: rgba(255,255,255,0.4);
      --w15: rgba(255,255,255,0.15);
      --w08: rgba(255,255,255,0.08);
      --sans: 'Barlow', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #000;
      color: #fff;
      font-family: var(--sans);
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

    /* Cabecera */
    .ev-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 72px;
      padding: 0 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--w08);
    }
    .ev-burger {
      justify-self: start;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      transition: background 200ms ease;
    }
    .ev-burger:hover, .ev-burger:focus-visible { background: var(--w08); }
    .ev-logo img { height: 38px; width: auto; display: block; }

    /* Botón "Eventos" con flecha de retroceso curva */
    .ev-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }
    .ev-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 18px 0 14px;
      border: 1px solid var(--w15);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white);
      transition: border-color 200ms ease, background 200ms ease, color 200ms ease;
    }
    .ev-back:hover, .ev-back:focus-visible {
      border-color: var(--gold);
      background: rgba(232,169,74,0.12);
      color: var(--gold);
    }
    .ev-back svg { width: 18px; height: 18px; flex: none; }
    .ev-back[hidden] { display: none; }

    /* Menú lateral */
    .ev-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
    }
    .ev-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      width: min(340px, 86vw);
      display: flex;
      flex-direction: column;
      padding: 22px 28px 32px;
      background: var(--night-2);
      border-right: 1px solid var(--w08);
      transform: translateX(-100%);
      transition: transform 300ms cubic-bezier(.2,.8,.2,1);
      visibility: hidden;
    }
    body.menu-open .ev-overlay { opacity: 1; pointer-events: auto; }
    body.menu-open .ev-drawer { transform: none; visibility: visible; }
    body.menu-open { overflow: hidden; }
    .ev-close {
      align-self: flex-end;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--w60);
    }
    .ev-close:hover, .ev-close:focus-visible { color: var(--white); background: var(--w08); }
    .ev-nav { list-style: none; margin: 18px 0 0; padding: 0; }
    .ev-nav a {
      display: block;
      padding: 13px 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--w60);
      border-bottom: 1px solid var(--w08);
      transition: color 200ms ease;
    }
    .ev-nav a:hover, .ev-nav a:focus-visible { color: var(--white); }
    .ev-nav a[aria-current="page"] { color: var(--gold); }
    .ev-social { display: flex; gap: 10px; margin-top: 28px; }
    .ev-social a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--w08);
      color: var(--w60);
      transition: color 200ms ease, border-color 200ms ease;
    }
    .ev-social a:hover, .ev-social a:focus-visible { color: var(--gold); border-color: var(--gold); }
    .ev-social svg { width: 16px; height: 16px; }
    .ev-drawer-logo { margin-top: auto; opacity: 0.5; }
    .ev-drawer-logo img { height: 34px; width: auto; display: block; }

    .ev-main { max-width: 1100px; margin: 0 auto; padding: 12px 0 40px; }

    @media (prefers-reduced-motion: reduce) {
      .ev-overlay, .ev-drawer { transition: none; }
    }
  </style>
</head>
<body>
  <header class="ev-header">
    <button class="ev-burger" type="button" aria-label="Abrir menú" aria-controls="ev-drawer" aria-expanded="false">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="1" x2="21" y2="1"/><line x1="1" y1="8" x2="15" y2="8"/><line x1="1" y1="15" x2="18" y2="15"/>
      </svg>
    </button>
    <a class="ev-logo" href="/" aria-label="Condado Club, ir al inicio">
      <img src="/assets/logos/logo-condado.png" alt="Condado Club" />
    </a>
    <span aria-hidden="true"></span>
  </header>

  <div class="ev-overlay" data-close></div>
  <nav class="ev-drawer" id="ev-drawer" aria-label="Menú principal">
    <button class="ev-close" type="button" aria-label="Cerrar menú" data-close>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="2" y1="2" x2="16" y2="16"/><line x1="16" y1="2" x2="2" y2="16"/>
      </svg>
    </button>
    <ul class="ev-nav">
      <li><a href="/">Inicio</a></li>
      <li><a href="/evento/" aria-current="page">Eventos y entradas</a></li>
      <li><a href="/calendario">Calendario</a></li>
      <li><a href="/mesas-vip">Zonas VIP</a></li>
      <li><a href="/sala">Sala</a></li>
      <li><a href="/eventos-privados">Eventos privados</a></li>
      <li><a href="/contacto">Contacto</a></li>
    </ul>
    <div class="ev-social">
      <a href="https://www.instagram.com/condado.club/" target="_blank" rel="noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://www.facebook.com/condadoclub/" target="_blank" rel="noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8.5V6.8c0-.8.5-1 .9-1h2.4V2.1L14 2c-3.6 0-4.4 2.7-4.4 4.4v2.1H7.5v3.8h2.1V22H14v-9.7h3l.4-3.8H14z"/></svg>
      </a>
      <a href="https://www.tiktok.com/@condadoclub" target="_blank" rel="noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.3 6.3 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.4 1.3V6.5A4.4 4.4 0 0 1 16.6 2z"/></svg>
      </a>
    </div>
    <a class="ev-drawer-logo" href="/" aria-label="Condado Club">
      <img src="/assets/logos/logo-condado.png" alt="" />
    </a>
  </nav>

  <div class="ev-bar">
    <a class="ev-back" href="/calendario" hidden>
      <!-- Flecha de retroceso curva -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 14 4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
      </svg>
      Eventos
    </a>
  </div>

  <main class="ev-main">
    <script src="https://www.fourvenues.com/assets/iframe/condado-club-denia/events"></script>
  </main>

  <script>
    (function () {
      var body = document.body;
      var burger = document.querySelector('.ev-burger');
      var drawer = document.getElementById('ev-drawer');

      function setMenu(open) {
        body.classList.toggle('menu-open', open);
        burger.setAttribute('aria-expanded', String(open));
        if (open) {
          drawer.querySelector('.ev-close').focus();
        } else {
          burger.focus();
        }
      }
      burger.addEventListener('click', function () { setMenu(true); });
      document.querySelectorAll('[data-close]').forEach(function (el) {
        el.addEventListener('click', function () { setMenu(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && body.classList.contains('menu-open')) setMenu(false);
      });

      // El botón "Eventos" solo aparece dentro de un evento concreto
      // (dirección del tipo /evento/#events/nombre-del-evento). Lleva al calendario.
      var back = document.querySelector('.ev-back');
      var lastHash = null;
      function syncBack() {
        if (location.hash === lastHash) return;
        lastHash = location.hash;
        back.hidden = !/^#\/?events\/[^/?]+/.test(location.hash);
      }
      syncBack();
      window.addEventListener('hashchange', syncBack);
      setInterval(syncBack, 500);
    })();
  </script>
</body>
</html>
